<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mavis — Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* ── TOKENS ──────────────────────────────────────────────── */
  :root {
    --cream:        #F5F0E8;
    --cream-deep:   #EDE7D9;
    --cream-border: #D9D0C0;
    --charcoal:     #1C1B1A;
    --charcoal-mid: #3D3B38;
    --charcoal-soft:#6B6760;
    --lavender:     #8B7FB8;
    --lavender-lt:  #C4BCDF;
    --lavender-bg:  #EAE7F3;
    --gold:         #C9A84C;
    --gold-lt:      #F0DFA0;
    --danger:       #C0574A;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;

    --drawer-w: 280px;
    --header-h: 56px;
    --input-area-h: 110px;

    --shadow-soft: 0 2px 16px rgba(28,27,26,0.08);
    --shadow-card: 0 1px 4px rgba(28,27,26,0.10);
  }

  /* ── RESET ───────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    height: -webkit-fill-available;
    overflow: hidden;
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LAYOUT SHELL ────────────────────────────────────────── */
  #dev-shell {
    display: flex;
    height: 100vh;
    height: -webkit-fill-available;
    position: relative;
    overflow: hidden;
  }

  /* ── DRAWER ──────────────────────────────────────────────── */
  #dev-drawer {
    position: fixed;
    top: 0; left: 0;
    width: var(--drawer-w);
    height: 100vh;
    background: var(--cream-deep);
    border-right: 1px solid var(--cream-border);
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 200;
    box-shadow: var(--shadow-soft);
  }
  #dev-drawer.open {
    transform: translateX(0);
  }

  #drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--cream-border);
  }
  .drawer-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--charcoal);
    letter-spacing: -0.02em;
  }
  .drawer-title span {
    color: var(--lavender);
  }
  #drawer-close {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--charcoal-soft);
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    border-radius: var(--radius-sm);
    transition: background 0.15s, color 0.15s;
  }
  #drawer-close:hover {
    background: var(--cream-border);
    color: var(--charcoal);
  }

  #drawer-section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--charcoal-soft);
    padding: 16px 16px 8px;
  }

  #drawer-thread-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  #drawer-thread-list::-webkit-scrollbar { width: 4px; }
  #drawer-thread-list::-webkit-scrollbar-thumb { background: var(--cream-border); border-radius: 4px; }

  .drawer-thread-item {
    padding: 10px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .drawer-thread-item:hover {
    background: var(--lavender-bg);
  }
  .drawer-thread-item.active {
    background: var(--lavender-bg);
    border-left: 3px solid var(--lavender);
    padding-left: 7px;
  }
  .dt-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--charcoal);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dt-meta {
    font-size: 12px;
    color: var(--charcoal-soft);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dt-status {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 4px;
  }
  .dt-status.active   { background: #D4EDDA; color: #276238; }
  .dt-status.paused   { background: var(--gold-lt); color: #7A5C1A; }
  .dt-status.complete { background: var(--lavender-bg); color: var(--lavender); }

  #drawer-footer {
    padding: 12px;
    border-top: 1px solid var(--cream-border);
  }
  #new-thread-btn-dev {
    width: 100%;
    padding: 10px;
    background: var(--lavender);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  #new-thread-btn-dev:hover { background: #7A6FA8; }

  /* ── OVERLAY (behind drawer) ─────────────────────────────── */
  #drawer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28,27,26,0.25);
    z-index: 199;
    backdrop-filter: blur(1px);
  }
  #drawer-overlay.visible { display: block; }

  /* ── MAIN CHAT AREA ──────────────────────────────────────── */
  #dev-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: -webkit-fill-available;
    min-width: 0;
    min-height: 0;
  }

  /* ── HEADER ──────────────────────────────────────────────── */
  #dev-header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    background: var(--cream);
    border-bottom: 1px solid var(--cream-border);
    flex-shrink: 0;
    position: relative;
  }

  #drawer-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--charcoal-soft);
    font-size: 20px;
    line-height: 1;
    padding: 6px;
    border-radius: var(--radius-sm);
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  #drawer-toggle:hover {
    background: var(--cream-deep);
    color: var(--charcoal);
  }

  #dev-context-label {
    flex: 1;
    min-width: 0;
    text-align: center;
  }
  #dev-context-label .ctx-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--charcoal);
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #dev-context-label .ctx-mode {
    font-size: 11px;
    color: var(--charcoal-soft);
    letter-spacing: 0.04em;
  }

  #dev-header-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .header-action-btn {
    background: none;
    border: 1px solid var(--cream-border);
    cursor: pointer;
    color: var(--charcoal-soft);
    font-size: 13px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .header-action-btn:hover {
    background: var(--cream-deep);
    color: var(--charcoal);
    border-color: var(--charcoal-soft);
  }

  /* ── MESSAGES ────────────────────────────────────────────── */
  #dev-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  #dev-messages::-webkit-scrollbar { width: 4px; }
  #dev-messages::-webkit-scrollbar-thumb { background: var(--cream-border); border-radius: 4px; }

  .dev-msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: msgIn 0.2s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dev-msg.user { align-items: flex-end; }
  .dev-msg.assistant { align-items: flex-start; }

  .msg-bubble {
    max-width: 88%;
    padding: 12px 16px;
    line-height: 1.6;
    font-size: 15px;
  }
  .dev-msg.user .msg-bubble {
    background: var(--lavender);
    color: #fff;
    border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
  }
  .dev-msg.assistant .msg-bubble {
    background: #fff;
    color: var(--charcoal);
    border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px;
    border: 1px solid var(--cream-border);
    box-shadow: var(--shadow-card);
  }

  .msg-label {
    font-size: 11px;
    color: var(--charcoal-soft);
    letter-spacing: 0.03em;
    padding: 0 4px;
  }

  /* thinking pulse */
  .thinking-pulse {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: #fff;
    border: 1px solid var(--cream-border);
    border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px;
    box-shadow: var(--shadow-card);
    width: fit-content;
  }
  .thinking-pulse span {
    width: 7px; height: 7px;
    background: var(--lavender-lt);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .thinking-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
    40%           { transform: scale(1.2); opacity: 1; }
  }

  /* ── INPUT AREA ──────────────────────────────────────────── */
  #dev-input-area {
    flex-shrink: 0;
    background: var(--cream);
    border-top: 1px solid var(--cream-border);
    padding: 12px 16px 16px;
  }

  #dev-input-context {
    font-size: 12px;
    color: var(--lavender);
    font-weight: 500;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
    min-height: 16px;
  }

  .dev-input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #dev-textarea {
    flex: 1;
    min-height: 52px;
    max-height: 140px;
    padding: 14px 16px;
    background: #fff;
    border: 1.5px solid var(--cream-border);
    border-radius: var(--radius-md);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--charcoal);
    line-height: 1.5;
    resize: none;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    overflow-y: auto;
  }
  #dev-textarea:focus {
    border-color: var(--lavender);
    box-shadow: 0 0 0 3px rgba(139,127,184,0.12);
  }
  #dev-textarea::placeholder { color: var(--charcoal-soft); }

  .dev-send-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  #dev-send-btn {
    width: 44px; height: 44px;
    background: var(--lavender);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  #dev-send-btn:hover  { background: #7A6FA8; }
  #dev-send-btn:active { transform: scale(0.92); }

  #dev-mic-btn {
    width: 44px; height: 44px;
    background: var(--cream-deep);
    color: var(--charcoal-soft);
    border: 1px solid var(--cream-border);
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  #dev-mic-btn:hover { background: var(--lavender-bg); color: var(--lavender); }
  #dev-mic-btn.listening {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
    animation: micPulse 1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192,87,74,0.4); }
    50%       { box-shadow: 0 0 0 8px rgba(192,87,74,0); }
  }

  /* ── BOARD PANEL (slides up from bottom inside thread) ───── */
  #dev-board-panel {
    display: none;
    background: var(--cream-deep);
    border-top: 1px solid var(--cream-border);
    padding: 16px;
    max-height: 45vh;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #dev-board-panel.visible { display: block; }
  #dev-board-panel::-webkit-scrollbar { width: 4px; }
  #dev-board-panel::-webkit-scrollbar-thumb { background: var(--cream-border); border-radius: 4px; }

  .board-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .board-panel-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--charcoal-soft);
  }
  #close-board-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--charcoal-soft);
    font-size: 16px;
  }

  .board-cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .board-card-mini {
    background: #fff;
    border: 1px solid var(--cream-border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 13px;
  }
  .bcm-zone {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--lavender);
    margin-bottom: 4px;
  }
  .bcm-text { color: var(--charcoal); line-height: 1.4; }

  /* ── THREAD ROUTING BANNER ───────────────────────────────── */
  #routing-banner {
    display: none;
    position: fixed;
    bottom: calc(var(--input-area-h) + 16px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--charcoal);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    font-weight: 500;
    z-index: 300;
    box-shadow: var(--shadow-soft);
    gap: 10px;
    align-items: center;
    max-width: 90vw;
    text-align: center;
  }
  #routing-banner.visible {
    display: flex;
    animation: bannerIn 0.25s ease-out;
  }
  @keyframes bannerIn {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  #routing-banner button {
    background: var(--lavender);
    border: none;
    color: #fff;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    white-space: nowrap;
  }
  #routing-dismiss {
    background: transparent !important;
    border: 1px solid rgba(255,255,255,0.3) !important;
    margin-left: 4px;
  }

  /* ── EMPTY STATE ─────────────────────────────────────────── */
  #dev-empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    gap: 12px;
    text-align: center;
  }
  .empty-wordmark {
    font-family: 'Fraunces', serif;
    font-size: 38px;
    font-weight: 600;
    color: var(--charcoal);
    letter-spacing: -0.03em;
  }
  .empty-wordmark em {
    color: var(--lavender);
    font-style: italic;
  }
  .empty-sub {
    font-size: 15px;
    color: var(--charcoal-soft);
    max-width: 260px;
    line-height: 1.5;
  }
  .empty-hint {
    font-size: 13px;
    color: var(--lavender);
    margin-top: 8px;
    padding: 8px 16px;
    background: var(--lavender-bg);
    border-radius: var(--radius-lg);
  }

  /* ── UTIL ────────────────────────────────────────────────── */
  .hidden { display: none !important; }
</style>
</head>

<body>
<div id="dev-shell">

  <!-- Drawer overlay -->
  <div id="drawer-overlay"></div>

  <!-- Project Drawer -->
  <div id="dev-drawer">
    <div id="drawer-header">
      <div class="drawer-title">Mavis <span>Dev</span></div>
      <button id="drawer-close">✕</button>
    </div>
    <div id="drawer-section-label">Projects</div>
    <div id="drawer-thread-list">
      <div style="padding: 16px; text-align:center; color: var(--charcoal-soft); font-size:13px;">Loading projects…</div>
    </div>
    <div id="drawer-footer">
      <button id="new-thread-btn-dev">+ New Project</button>
    </div>
  </div>

  <!-- Main -->
  <div id="dev-main">

    <!-- Header -->
    <div id="dev-header">
      <button id="drawer-toggle">☰</button>
      <button id="back-to-dash" style="display:none;background:none;border:1px solid var(--cream-border);cursor:pointer;color:var(--charcoal-soft);font-size:12px;padding:5px 10px;border-radius:8px;font-family:'DM Sans',sans-serif;flex-shrink:0;">← Dash</button>
      <div id="dev-context-label">
        <div class="ctx-title" id="ctx-title-text">Mavis</div>
        <div class="ctx-mode" id="ctx-mode-text">Dashboard</div>
      </div>
      <div id="dev-header-actions">
        <button class="header-action-btn" id="board-toggle-btn">Board</button>
        <button class="header-action-btn" id="foreman-btn">Foreman</button>
      </div>
    </div>

    <!-- Board Panel (hidden by default) -->
    <div id="dev-board-panel">
      <div class="board-panel-header">
        <div class="board-panel-title">Project Board</div>
        <button id="close-board-btn">✕</button>
      </div>
      <div class="board-cards-grid" id="board-cards-mini"></div>
    </div>

    <!-- Messages -->
    <div id="dev-messages">
      <div id="dev-empty-state">
        <div class="empty-wordmark">Ma<em>v</em>is</div>
        <div class="empty-sub">The factory floor. What are we building today?</div>
        <div class="empty-hint">☰ Open drawer to switch projects</div>
      </div>
    </div>

    <!-- Input -->
    <div id="dev-input-area">
      <div id="dev-input-context"></div>
      <div class="dev-input-row">
        <textarea id="dev-textarea" placeholder="Talk to Mavis…" rows="2"></textarea>
        <div class="dev-send-col">
          <button id="dev-send-btn">↑</button>
          <button id="dev-mic-btn">🎤</button>
        </div>
      </div>
    </div>

  </div><!-- /dev-main -->

</div><!-- /dev-shell -->

<!-- Routing banner -->
<div id="routing-banner">
  <span id="routing-banner-text"></span>
  <button id="routing-confirm">Go there</button>
  <button id="routing-dismiss">Stay here</button>
</div>

<!-- ── DEV UI LOGIC ─────────────────────────────────────────── -->
<script>
document.addEventListener('DOMContentLoaded', function() {
(function() {

  // ── State ────────────────────────────────────────────────
  let activeThreadId   = null;
  let activeThreadName = 'Dashboard';
  let isListening      = false;
  let threads          = [];

  // ── DOM refs ─────────────────────────────────────────────
  const drawer         = document.getElementById('dev-drawer');
  const overlay        = document.getElementById('drawer-overlay');
  const drawerToggle   = document.getElementById('drawer-toggle');
  const drawerClose    = document.getElementById('drawer-close');
  const threadList     = document.getElementById('drawer-thread-list');
  const messages       = document.getElementById('dev-messages');
  const textarea       = document.getElementById('dev-textarea');
  const sendBtn        = document.getElementById('dev-send-btn');
  const micBtn         = document.getElementById('dev-mic-btn');
  const ctxTitle       = document.getElementById('ctx-title-text');
  const ctxMode        = document.getElementById('ctx-mode-text');
  const inputContext   = document.getElementById('dev-input-context');
  const boardPanel     = document.getElementById('dev-board-panel');
  const boardCards     = document.getElementById('board-cards-mini');
  const boardToggleBtn = document.getElementById('board-toggle-btn');
  const closeBoardBtn  = document.getElementById('close-board-btn');
  const emptyState     = document.getElementById('dev-empty-state');
  const routingBanner  = document.getElementById('routing-banner');
  const routingText    = document.getElementById('routing-banner-text');
  const routingConfirm = document.getElementById('routing-confirm');
  const routingDismiss = document.getElementById('routing-dismiss');
  const foremanBtn     = document.getElementById('foreman-btn');
  const newThreadBtn   = document.getElementById('new-thread-btn-dev');

  // ── Drawer ───────────────────────────────────────────────
  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('visible');
    loadThreadsIntoDrawer();
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('visible');
  }
  drawerToggle.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
  document.getElementById('back-to-dash').addEventListener('click', switchToDashboard);

  // ── Load threads ─────────────────────────────────────────
  async function loadThreadsIntoDrawer() {
    threadList.innerHTML = '<div style="padding:16px;text-align:center;color:var(--charcoal-soft);font-size:13px;">Loading…</div>';
    try {
      const SB_URL = 'https://jbsocnomwxodqyhiukcl.supabase.co';
      const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impic29jbm9td3hvZHF5aGl1a2NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjQ5NTUsImV4cCI6MjA5Mzg0MDk1NX0.ehX6AEqpSpVAF9Q3UxIabZXdZKLDqKKP9KL3pDIPhHE';
      const client = window.supabase.createClient(SB_URL, SB_KEY);

      const { data, error } = await client
        .from('Threads')
        .select('id, "Thread name", "Status", "Next step", "Goal"')
        .order('last_activity_at', { ascending: false });

      if (error) throw error;
      threads = data || [];
      renderDrawerThreads(threads);
    } catch (e) {
      threadList.innerHTML = `<div style="padding:16px;color:var(--danger);font-size:13px;">Could not load projects: ${e.message}</div>`;
    }
  }

  function renderDrawerThreads(list) {
    if (!list.length) {
      threadList.innerHTML = '<div style="padding:16px;color:var(--charcoal-soft);font-size:13px;">No projects yet.</div>';
      return;
    }
    threadList.innerHTML = list.map(t => `
      <div class="drawer-thread-item ${t.id === activeThreadId ? 'active' : ''}"
           data-id="${t.id}" data-name="${escHtml(t['Thread name'])}">
        <div class="dt-name">${escHtml(t['Thread name'])}</div>
        ${t['Next step'] ? `<div class="dt-meta">→ ${escHtml(t['Next step'])}</div>` : ''}
        <span class="dt-status ${(t['Status']||'active').toLowerCase()}">${t['Status'] || 'Active'}</span>
      </div>
    `).join('');

    threadList.querySelectorAll('.drawer-thread-item').forEach(el => {
      el.addEventListener('click', () => {
        const id   = el.dataset.id;
        const name = el.dataset.name;
        switchToThread(id, name);
        closeDrawer();
      });
    });
  }

  // ── Thread switching ─────────────────────────────────────
  function switchToThread(id, name) {
    activeThreadId   = id;
    activeThreadName = name;
    ctxTitle.textContent = name;
    ctxMode.textContent  = 'Project';
    inputContext.textContent = `In: ${name}`;
    document.getElementById('back-to-dash').style.display = 'inline';
    clearMessages();
    appendMessage('assistant', `Switched to <strong>${escHtml(name)}</strong>. What are we working on?`);
  }

  function switchToDashboard() {
    activeThreadId   = null;
    activeThreadName = 'Dashboard';
    ctxTitle.textContent = 'Mavis';
    ctxMode.textContent  = 'Dashboard';
    inputContext.textContent = '';
    boardPanel.classList.remove('visible');
    document.getElementById('back-to-dash').style.display = 'none';
    clearMessages();
    emptyState.classList.remove('hidden');
  }

  // ── Board panel ──────────────────────────────────────────
  boardToggleBtn.addEventListener('click', () => {
    if (boardPanel.classList.contains('visible')) {
      boardPanel.classList.remove('visible');
    } else {
      boardPanel.classList.add('visible');
      if (activeThreadId) loadBoardCards(activeThreadId);
    }
  });
  closeBoardBtn.addEventListener('click', () => boardPanel.classList.remove('visible'));

  async function loadBoardCards(threadId) {
    boardCards.innerHTML = '<div style="color:var(--charcoal-soft);font-size:13px;grid-column:1/-1">Loading board…</div>';
    const thread = threads.find(t => t.id === threadId);
    if (!thread) return;
    // Minimal board from thread data
    const zones = [
      { zone: 'Goal',      text: thread['Goal']      || '—' },
      { zone: 'Next Step', text: thread['Next step']  || '—' },
    ];
    boardCards.innerHTML = zones.map(z => `
      <div class="board-card-mini">
        <div class="bcm-zone">${escHtml(z.zone)}</div>
        <div class="bcm-text">${escHtml(z.text)}</div>
      </div>
    `).join('');
  }

  // ── Foreman ──────────────────────────────────────────────
  foremanBtn.addEventListener('click', () => {
    appendMessage('user', '/foreman status');
    sendToMavis('/foreman status');
  });

  // ── New thread ───────────────────────────────────────────
  newThreadBtn.addEventListener('click', () => {
    closeDrawer();
    const name = prompt('Project name?');
    if (name && name.trim()) {
      appendMessage('user', `Create project: ${name.trim()}`);
      sendToMavis(`Create a new project called "${name.trim()}"`);
    }
  });

  // ── Messaging ────────────────────────────────────────────
  function clearMessages() {
    emptyState.classList.add('hidden');
    messages.innerHTML = '';
  }

  function appendMessage(role, html) {
    emptyState.classList.add('hidden');
    const el = document.createElement('div');
    el.className = `dev-msg ${role}`;
    el.innerHTML = `
      <div class="msg-label">${role === 'user' ? 'You' : 'Mavis'}</div>
      <div class="msg-bubble">${html}</div>
    `;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function showThinking() {
    emptyState.classList.add('hidden');
    const el = document.createElement('div');
    el.className = 'dev-msg assistant';
    el.id = 'thinking-indicator';
    el.innerHTML = `
      <div class="msg-label">Mavis</div>
      <div class="thinking-pulse"><span></span><span></span><span></span></div>
    `;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }

  // ── Send ─────────────────────────────────────────────────
  async function handleSend() {
    const text = textarea.value.trim();
    if (!text) return;
    textarea.value = '';
    textarea.style.height = 'auto';
    appendMessage('user', escHtml(text));
    await sendToMavis(text);
  }

  async function sendToMavis(text) {
    checkRoutingSignal(text);
    showThinking();
    try {
      const context = activeThreadId ? 'Project "' + activeThreadName + '"' : 'Dashboard (cross-project)';
const projectList = threads.map(t => t['Thread name']).join(', ') || 'none';
const system = 'You are Mavis, a modular AI app factory assistant. David Rogers is the President and sole creator, working phone-only. Current context: ' + context + '. Active projects: ' + projectList + '. Be direct, efficient. No markdown, no bullet points. Treat every session as working time.';

      const res = await fetch('https://mavis-umber.vercel.app/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system,
          messages: [{ role: 'user', content: text }]
        })
      });
      const data = await res.json();
      removeThinking();
      const reply = data.content?.find(b => b.type === 'text')?.text || data.error || 'No response.';
      appendMessage('assistant', mdToHtml(reply));
    } catch (e) {
      removeThinking();
      appendMessage('assistant', `<span style="color:var(--danger)">Error: ${escHtml(e.message)}</span>`);
    }
  }

  // ── Routing signal detection ─────────────────────────────
  function checkRoutingSignal(text) {
    if (!threads.length) return;
    const lower = text.toLowerCase();
    const match = threads.find(t =>
      lower.includes((t['Thread name']||'').toLowerCase()) && t.id !== activeThreadId
    );
    if (match) {
      showRoutingBanner(match);
    }
  }

  function showRoutingBanner(thread) {
    routingText.textContent = `This looks like ${thread.name} territory.`;
    routingBanner.classList.add('visible');
    routingConfirm.onclick = () => {
      routingBanner.classList.remove('visible');
      switchToThread(thread.id, thread.name);
    };
    routingDismiss.onclick = () => {
      routingBanner.classList.remove('visible');
    };
    setTimeout(() => routingBanner.classList.remove('visible'), 8000);
  }

  // ── Auto-resize textarea ─────────────────────────────────
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
  });

  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  sendBtn.addEventListener('click', handleSend);

  // ── Voice ─────────────────────────────────────────────────
  micBtn.addEventListener('click', () => {
    if (typeof startVoiceInput === 'function') {
      startVoiceInput(text => { textarea.value = text; handleSend(); });
    } else if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SR();
      recognition.lang = 'en-US';
      recognition.onstart = () => micBtn.classList.add('listening');
      recognition.onend   = () => micBtn.classList.remove('listening');
      recognition.onresult = e => {
        textarea.value = e.results[0][0].transcript;
        handleSend();
      };
      recognition.start();
    }
  });

  // ── Utility ───────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function mdToHtml(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code style="background:var(--cream-deep);padding:1px 5px;border-radius:4px;font-size:0.9em">$1</code>')
      .replace(/\n/g, '<br>');
  }

  // ── Init ─────────────────────────────────────────────────
  setTimeout(loadThreadsIntoDrawer, 500);

})();
}); // DOMContentLoaded
</script>

</body>
</html>
